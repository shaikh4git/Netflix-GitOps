
apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: netflix-rollout
  namespace: argo-rollouts

spec:
  replicas: 10
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: netflix

  template:
    metadata:
      labels:
        app: netflix

    spec:
      containers:
        - name: netflix
          image: shaikhdocker/netflix:14-e70831a
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0

      steps:
        # Stage 1: 25% new version
        - setWeight: 25
        - pause: {}

        # Stage 2: 50% new version
        - setWeight: 50
        - pause:
            duration: 60s

        # Stage 3: 75% new version
        - setWeight: 75
        - pause:
            duration: 60s
