
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: netflix
  namespace: netflix
spec:
  replicas: 10
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: netflix

  template:
    metadata:
      labels:
        app: netflix
    spec:
      containers:
        - name: netflix
          image: shaikhdocker/netflix:12-f7f8e1a
          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0

      steps:
        - setWeight: 20
        - pause: {}

        - setWeight: 40
        - pause:
            duration: 30s

        - setWeight: 60
        - pause:
            duration: 30s

        - setWeight: 80
        - pause:
            duration: 30s
