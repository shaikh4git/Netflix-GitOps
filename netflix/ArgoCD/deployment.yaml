apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-deployment
  namespace: argocd-std
spec:
  replicas: 3
  selector:
    matchLabels:
      app: netflix
  template:
    metadata:
      labels:
        app: netflix
    spec:
      containers:
        - name: netflix
          image: shaikhdocker/netflix:15-cee2f17
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
