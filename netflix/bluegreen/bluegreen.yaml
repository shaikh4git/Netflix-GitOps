
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: netflix-bluegreen
  namespace: argo-bluegreen

spec:
  replicas: 3
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: netflix-bluegreen

  template:
    metadata:
      labels:
        app: netflix-bluegreen
    spec:
      containers:
        - name: netflix
          image: shaikhdocker/netflix:5-e593f3b
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

  strategy:
    blueGreen:
      activeService: netflix-active
      previewService: netflix-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 60
