apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix
  namespace: netflix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netflix
  template:
    metadata:
      labels:
        app: netflix
    spec:
      containers:
        - name: netflix
          image: shaikhdocker/netflix:11-dc93ec7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80