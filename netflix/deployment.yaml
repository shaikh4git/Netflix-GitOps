apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix
  namespace: netflix
spec:
  replicas: 3
  selector:
    matchLabels:
      app: netflix
  template:
    metadata:
      labels:
        app: netflix
    spec:
      containers:
        - name: netflix
          image: shaikhdocker/netflix:12-f7f8e1a
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80