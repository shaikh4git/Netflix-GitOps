apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netflix
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/shaikh4git/Netflix-GitOps.git
    targetRevision: main
    path: netflix

  destination:
    server: https://kubernetes.default.svc
    namespace: netflix

  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true